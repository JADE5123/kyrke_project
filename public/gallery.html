<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY - KYRKE</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
</head>
<body>
    <header>
        <div id="brand"><a href="index.html">KYRKE</a></div>
        <nav id="nav-menu">
            <a href="product.html">PRODUCT</a>
            <a href="news.html">NEWS</a>
            <a href="gallery.html">GALLERY</a>
        </nav>
    </header>

    <main>
        <section id="gallery">
            <h2>GALLERY</h2>
            
            <!-- ✅ 관리자만 보이는 업로드 버튼 -->
            <div id="admin-gallery-controls" class="hidden">
                <input type="file" id="upload-image" accept="image/*">
                <button onclick="uploadGalleryImage()">이미지 업로드</button>
            </div>
            
            <div id="gallery-list" class="gallery-grid">갤러리 로드 중...</div>
        </section>
    </main>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    firebase.firestore().collection("users").doc(user.uid).get().then(doc => {
                        if (doc.exists && doc.data().role === "admin") {
                            document.getElementById("admin-gallery-controls").classList.remove("hidden");
                        }
                    });
                }
            });

            function uploadGalleryImage() {
                const file = document.getElementById("upload-image").files[0];
                if (!file) return;

                const storageRef = firebase.storage().ref("gallery/" + file.name);
                storageRef.put(file).then(snapshot => {
                    snapshot.ref.getDownloadURL().then(url => {
                        firebase.firestore().collection("gallery").add({
                            imageUrl: url,
                            uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => {
                            alert("이미지가 업로드되었습니다!");
                            location.reload();
                        });
                    });
                });
            }

            function loadGallery() {
                const galleryList = document.getElementById("gallery-list");
                galleryList.innerHTML = "";
                
                firebase.firestore().collection("gallery").orderBy("uploadedAt", "desc").onSnapshot(snapshot => {
                    snapshot.docs.forEach(doc => {
                        const data = doc.data();
                        const imgElement = document.createElement("img");
                        imgElement.src = data.imageUrl;
                        imgElement.classList.add("gallery-item");
                        galleryList.appendChild(imgElement);
                    });
                });
            }

            loadGallery();
        });
    </script>
    
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .gallery-item {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .hidden { display: none; }
    </style>
</body>
</html>

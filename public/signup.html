<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - KYRKE</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
</head>
<body>
    <header>
        <div id="brand"><a href="index.html">KYRKE</a></div>
    </header>

    <main>
        <section id="signup">
            <h2>회원가입</h2>
            <input type="email" id="signup-email" placeholder="이메일">
            <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)">
            <input type="text" id="signup-name" placeholder="이름">
            <input type="text" id="signup-phone" placeholder="연락처">
            <input type="text" id="signup-address" placeholder="배송 주소">
            <select id="signup-role">
                <option value="customer">일반 고객</option>
                <option value="admin">관리자</option>
            </select>
            <button onclick="signUp()">회원가입</button>
            <p>이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
        </section>
    </main>
</body>
</html>

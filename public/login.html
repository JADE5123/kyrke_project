<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - KYRKE</title>

    <!-- ✅ Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="brand"><a href="index.html">KYRKE</a></div>
    </header>

    <main>
        <section id="login">
            <h2>로그인</h2>
            <input type="email" id="login-email" placeholder="이메일">
            <input type="password" id="login-password" placeholder="비밀번호">
            <button id="login-btn">로그인</button> <!-- ✅ 버튼 ID 변경 -->
            <p>계정이 없으신가요? <a href="signup.html">회원가입</a></p>
        </section>
    </main>

    <!-- ✅ app.js를 body 맨 아래에서 로드 -->
    <script defer src="app.js"></script>

    <!-- ✅ login()을 버튼 이벤트로 연결 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginBtn = document.getElementById("login-btn");
            if (loginBtn) {
                loginBtn.addEventListener("click", () => {
                    if (typeof login === "function") {
                        login();
                    } else {
                        console.error("login() 함수가 정의되지 않았음.");
                    }
                });
            }
        });
    </script>
</body>
</html>
